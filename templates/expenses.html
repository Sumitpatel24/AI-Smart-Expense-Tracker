<!DOCTYPE html>
<html>

<head>

    <title>Expenses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e293b,
    #2563eb
    );

    font-family:'Segoe UI',sans-serif;

    color:white;
}

/* Heading */

h2{

    font-size:45px;

    font-weight:800;

    color:white;

    text-shadow:
    0 0 20px rgba(255,255,255,.15);
}

/* Cards */

.card{

    background:
    rgba(255,255,255,0.10);

    backdrop-filter:blur(20px);

    border:
    1px solid rgba(255,255,255,0.15);

    border-radius:22px;

    color:white;

    overflow:hidden;

    transition:.35s;

    box-shadow:
    0 15px 40px rgba(0,0,0,.35);
}

.card:hover{

    transform:
    translateY(-5px);

    box-shadow:
    0 25px 45px rgba(0,0,0,.45);
}

/* Labels */

.form-label{

    font-size:18px;

    font-weight:700;

    color:#f8fafc;
}

/* Inputs */

.form-control,
.form-select{

    background:
    rgba(255,255,255,0.12);

    border:
    1px solid rgba(255,255,255,0.18);

    color:white;

    border-radius:15px;

    padding:12px;

    transition:.3s;
}

/* Placeholder */

.form-control::placeholder{

    color:#cbd5e1;
}

/* Hover */

.form-control:hover,
.form-select:hover{

    transform:
    translateY(-2px);

    border-color:#60a5fa;

    box-shadow:
    0 8px 20px rgba(59,130,246,.25);
}

/* Focus */

.form-control:focus,
.form-select:focus{

    background:
    rgba(255,255,255,0.18);

    color:white;

    border-color:#38bdf8;

    box-shadow:
    0 0 15px rgba(56,189,248,.4);
}

/* Dropdown Options */

.form-select option{

    background:#ffffff;

    color:#000000;
}

/* Table */

.table{

    color:white;
}

.table td,
.table th{

    vertical-align:middle;
}

/* Buttons */

.btn{

    border:none;

    border-radius:10px;
}

/* Light Mode Support */

body.light{

    background:
    linear-gradient(
    135deg,
    #ffffff,
    #f1f5f9,
    #dbeafe
    );

    color:#111827;
}

/* Headings */

body.light h1,
body.light h2,
body.light h3,
body.light h4,
body.light h5,
body.light h6{

    color:#111827 !important;
}

/* Cards */

body.light .card{

    background:#ffffff !important;

    color:#111827 !important;

    border:
    1px solid #e5e7eb;

    box-shadow:
    0 10px 25px rgba(0,0,0,.10);
}

/* Card ke andar sab text */

body.light .card *{

    color:#374151 !important;
}

/* Big Numbers */

body.light .card h2,
body.light .card h3,
body.light .card h4{

    color:#111827 !important;

    font-weight:800;
}

/* Statistics Labels */

body.light .stat-title,
body.light .metric-title,
body.light .card-title,
body.light .total-label{

    color:#6b7280 !important;
}

/* Form Labels */

body.light .form-label{

    color:#111827 !important;
}

/* Inputs */

body.light .form-control,
body.light .form-select{

    background:#ffffff;

    color:#111827;

    border:
    1px solid #d1d5db;
}

body.light .form-control::placeholder{

    color:#6b7280;
}

body.light .form-select option{

    background:#ffffff;

    color:#111827;
}

/* Tables */

body.light .table,
body.light .table td,
body.light .table th{

    color:#111827 !important;
}

/* Alerts */

body.light .alert-success{

    background:#dcfce7;

    color:#166534;
}

body.light .alert-danger{

    background:#fee2e2;

    color:#991b1b;
}

body.light .alert-warning{

    background:#fef3c7;

    color:#92400e;
}

body.light .alert-info{

    background:#dbeafe;

    color:#1e40af;
}

</style>
</head>

<body>

<body>

<div class="container mt-5">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>My Expenses</h2>

        <a href="/dashboard" class="btn btn-secondary">
            Dashboard
        </a>

    </div>

    <!-- Search & Filter -->

    <div class="card shadow mb-4">

        <div class="card-body">

            <form method="GET" action="/expenses">

                <div class="row">

                    <!-- Search Description -->

                    <div class="col-md-3">

                        <label class="form-label">
                            Search Description
                        </label>

                        <input
                            type="text"
                            name="keyword"
                            class="form-control"
                            placeholder="Search description">

                    </div>

                    <!-- Category -->

                    <div class="col-md-3">

                        <label class="form-label">
                            Category
                        </label>

                        <select
                            name="category"
                            class="form-select">

                            <option value="">All</option>

                            <option>Food</option>
                            <option>Travel</option>
                            <option>Shopping</option>
                            <option>Bills</option>
                            <option>Entertainment</option>
                            <option>Hospital</option>
                            <option>Education</option>
                            <option>Fuel</option>
                            <option>Rent</option>

                        </select>

                    </div>

                    <!-- From Date -->

                    <div class="col-md-2">

                        <label class="form-label">
                            From
                        </label>

                        <input
                            type="date"
                            name="start_date"
                            class="form-control">

                    </div>

                    <!-- To Date -->

                    <div class="col-md-2">

                        <label class="form-label">
                            To
                        </label>

                        <input
                            type="date"
                            name="end_date"
                            class="form-control">

                    </div>

                    <!-- Filter Button -->

                    <div class="col-md-2">

                        <label class="form-label">
                            &nbsp;
                        </label>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Filter

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <!-- Expense Table -->

    <div class="card shadow">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Date</th>
                            <th>Receipt</th>
                            <th width="200">Actions</th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for e in expenses %}

                        <tr>

                            <td>{{ e[0] }}</td>

                            <td>₹ {{ e[1] }}</td>

                            <td>{{ e[2] }}</td>

                            <td>{{ e[3] }}</td>

                            <td>{{ e[4] }}</td>

                            <!-- Receipt -->

                            <td>

                                {% if e[5] %}

                                <a
                                    href="{{ url_for('static', filename='receipts/' + e[5]) }}"
                                    target="_blank"
                                    class="btn btn-info btn-sm">

                                    View Receipt

                                </a>

                                {% else %}

                                <span class="text-muted">
                                    No Receipt
                                </span>

                                {% endif %}

                            </td>

                            <!-- Actions -->

                            <td>

                                <a
                                    href="/edit_expense/{{ e[0] }}"
                                    class="btn btn-warning btn-sm">

                                    Edit

                                </a>

                                <a
                                    href="/delete_expense/{{ e[0] }}"
                                    class="btn btn-danger btn-sm"
                                    onclick="return confirm('Delete this expense?')">

                                    Delete

                                </a>

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

setTimeout(function(){

    document.querySelectorAll('.alert').forEach(function(alert){

        alert.style.transition = "0.5s";
        alert.style.opacity = "0";

        setTimeout(function(){

            alert.remove();

        }, 500);

    });

}, 3000);

</script>
</body>

</html>
