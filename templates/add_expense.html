<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            min-height:100vh;

            background:
            linear-gradient(
            135deg,
            #0f172a,
            #1e293b,
            #2563eb
            );

            display:flex;
            justify-content:center;
            align-items:center;

            padding:40px;

            font-family:'Segoe UI',sans-serif;
        }

        .expense-card{

            width:850px;

            background:
            rgba(255,255,255,0.10);

            backdrop-filter:blur(25px);

            border:
            1px solid rgba(255,255,255,0.15);

            border-radius:30px;

            padding:50px;

            color:white;

            box-shadow:
            0 25px 60px rgba(0,0,0,.45);

            transition:.4s;
        }

        .expense-card:hover{

            transform:
            translateY(-8px);

            box-shadow:
            0 35px 80px rgba(0,0,0,.55);
        }

        .title{

            text-align:center;

            font-size:52px;

            font-weight:800;

            margin-bottom:40px;
        }

        .title i{

            color:#38bdf8;

            margin-right:12px;

            text-shadow:
            0 0 20px #38bdf8;
        }

        label{

            display:block;

            font-size:22px;

            font-weight:700;

            margin-bottom:12px;

            color:white;

            transition:.3s;
        }

        .mb-4:hover label{

            color:#38bdf8;

            text-shadow:
            0 0 15px rgba(56,189,248,.8);
        }

        label i{

            margin-right:8px;

            color:#38bdf8;
        }

        .form-control,
        .form-select{

            background:
            rgba(255,255,255,0.12);

            border:
            1px solid rgba(255,255,255,0.2);

            color:white;

            border-radius:18px;

            padding:20px;

            font-size:19px;

            transition:.3s;
        }

        .form-control::placeholder{

            color:#d1d5db;
        }

        .form-select option{

            color:black;
        }

        .form-control:hover,
        .form-select:hover{

            transform:
            translateY(-3px);

            border-color:#60a5fa;

            box-shadow:
            0 12px 25px rgba(96,165,250,.25);
        }

        .form-control:focus,
        .form-select:focus{

            background:
            rgba(255,255,255,0.18);

            border-color:#38bdf8;

            color:white;

            box-shadow:
            0 0 25px rgba(56,189,248,.55);
        }

        .btn-save{

            width:100%;

            padding:20px;

            border:none;

            border-radius:18px;

            font-size:22px;

            font-weight:700;

            color:white;

            background:
            linear-gradient(
            135deg,
            #3b82f6,
            #8b5cf6
            );

            transition:.35s;
        }

        .btn-save:hover{

            transform:
            translateY(-4px) scale(1.02);

            box-shadow:
            0 18px 40px rgba(139,92,246,.55);
        }

        .back-btn{

            display:block;

            text-align:center;

            text-decoration:none;

            margin-top:25px;

            font-size:18px;

            font-weight:600;

            color:#e2e8f0;

            transition:.3s;
        }

        .back-btn:hover{

            color:#38bdf8;
        }

        @media(max-width:900px){

            .expense-card{

                width:100%;
                padding:30px;
            }

            .title{

                font-size:36px;
            }

            label{

                font-size:18px;
            }
        }

    </style>

</head>
<body>

<div class="expense-card">

    <h1 class="title">
        <i class="bi bi-wallet2"></i>
        Add Expense
    </h1>

    <!-- Flash Messages -->

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}

    {% for category, message in messages %}

        <div class="alert alert-{{ category }} alert-dismissible fade show">

            {{ message }}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close">
            </button>

        </div>

    {% endfor %}

    {% endif %}
{% endwith %}

    <form method="POST" enctype="multipart/form-data" autocomplete="off">

        <!-- Amount -->

        <div class="mb-4">

            <label>
                <i class="bi bi-currency-rupee"></i>
                Amount
            </label>

            <input
                type="number"
                step="0.01"
                min="1"
                name="amount"
                class="form-control"
                placeholder="Enter Expense Amount"
                required>

        </div>

        <!-- Category -->

        <div class="mb-4">

            <label>
                <i class="bi bi-tags-fill"></i>
                Category
            </label>

            <select
                name="category"
                id="category"
                class="form-select"
                required>

                <option value="" selected disabled>
                    Select Category
                </option>

                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Hospital">Hospital</option>
                <option value="Education">Education</option>
                <option value="Fuel">Fuel</option>
                <option value="Rent">Rent</option>
                <option value="Other">Other</option>

            </select>

        </div>

        <!-- Custom Category -->

        <div
            class="mb-4"
            id="custom-category-box"
            style="display:none;">

            <label>
                <i class="bi bi-pencil-square"></i>
                Custom Category
            </label>

            <input
                type="text"
                name="custom_category"
                id="custom_category"
                class="form-control"
                placeholder="Enter Category Name">

        </div>

        <!-- Description -->

        <div class="mb-4">

            <label>
                <i class="bi bi-card-text"></i>
                Description
            </label>

            <input
                type="text"
                name="description"
                class="form-control"
                placeholder="Enter Expense Description">

        </div>

        <!-- Date -->

        <div class="mb-4">

            <label>
                <i class="bi bi-calendar-event-fill"></i>
                Expense Date
            </label>

            <input
                type="date"
                name="expense_date"
                class="form-control"
                required>

        </div>
        <!-- Receipt Upload -->

    <div class="mb-4">

    <label>

        <i class="bi bi-receipt"></i>

        Upload Receipt

    </label>

    <input
        type="file"
        name="receipt"
        class="form-control"
        accept=".jpg,.jpeg,.png,.pdf">

    </div>

        <!-- Button -->

        <button
            type="submit"
            class="btn-save">

            <i class="bi bi-check-circle-fill"></i>
            Save Expense

        </button>

    </form>

    <a
        href="/dashboard"
        class="back-btn">

        <i class="bi bi-arrow-left-circle"></i>
        Back To Dashboard

    </a>

</div>

<script>

const category = document.getElementById("category");
const customBox = document.getElementById("custom-category-box");
const customInput = document.getElementById("custom_category");

category.addEventListener("change", function(){

    if(this.value === "Other"){

        customBox.style.display = "block";

        customInput.required = true;

    }
    else{

        customBox.style.display = "none";

        customInput.required = false;

        customInput.value = "";

    }

});

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

setTimeout(function(){

    document.querySelectorAll('.alert').forEach(function(alert){

        alert.style.transition = "0.5s";
        alert.style.opacity = "0";

        setTimeout(function(){

            alert.remove();

        }, 500);

    });

}, 3000);

</script>
</body>
</html>
