<!DOCTYPE html>
<html>

<head>

    <title>Forgot Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e293b,
    #2563eb
    );

    font-family:'Segoe UI',sans-serif;
}

.reset-card{

    width:500px;

    background:
    rgba(255,255,255,0.10);

    backdrop-filter:blur(20px);

    border:
    1px solid rgba(255,255,255,0.15);

    border-radius:25px;

    padding:40px;

    color:white;

    box-shadow:
    0 15px 40px rgba(0,0,0,.35);
}

.reset-card h2{

    text-align:center;

    font-size:35px;

    font-weight:800;

    margin-bottom:10px;
}

.subtitle{

    text-align:center;

    color:#cbd5e1;

    margin-bottom:30px;
}

.form-label{

    color:white;

    font-weight:600;
}

.form-control{

    background:
    rgba(255,255,255,0.12);

    border:
    1px solid rgba(255,255,255,0.18);

    color:white;

    border-radius:12px;

    padding:12px;
}

.form-control::placeholder{

    color:#cbd5e1;
}

.form-control:focus{

    background:
    rgba(255,255,255,0.18);

    color:white;

    border-color:#38bdf8;

    box-shadow:
    0 0 15px rgba(56,189,248,.4);
}

.btn-reset{

    width:100%;

    padding:12px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-weight:700;

    transition:.3s;
}

.btn-reset:hover{

    background:#1d4ed8;

    transform:
    translateY(-2px);
}

.back-link{

    text-align:center;

    margin-top:20px;
}

.back-link a{

    color:#93c5fd;

    text-decoration:none;
}

.back-link a:hover{

    color:white;
}

</style>

</head>

<body>

<div class="reset-card">

    <h2>
        🔐 Forgot Password
    </h2>

    <p class="subtitle">
        Reset your account password
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}

        {% for category, message in messages %}

            <div class="alert alert-{{ category }}">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">

                Username

            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter Username"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Security Answer

            </label>

            <input
                type="text"
                name="security_answer"
                class="form-control"
                placeholder="Favourite Color"
                required>

        </div>

        <div class="mb-4">

            <label class="form-label">

                New Password

            </label>

            <input
                type="password"
                name="new_password"
                class="form-control"
                placeholder="Enter New Password"
                required>

        </div>

        <button
            type="submit"
            class="btn-reset">

            Reset Password

        </button>

    </form>

    <div class="back-link">

        <a href="/login">

            ← Back To Login

        </a>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

setTimeout(function(){

    document.querySelectorAll('.alert').forEach(function(alert){

        alert.style.transition = "0.5s";
        alert.style.opacity = "0";

        setTimeout(function(){

            alert.remove();

        }, 500);

    });

}, 3000);

</script>
</body>
</html>
