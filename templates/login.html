<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e293b,
    #2563eb
    );

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Segoe UI',sans-serif;
}

.login-card{

    width:500px;

    background:
    rgba(255,255,255,0.10);

    backdrop-filter:blur(20px);

    border:
    1px solid rgba(255,255,255,0.15);

    border-radius:25px;

    padding:40px;

    color:white;

    box-shadow:
    0 20px 50px rgba(0,0,0,.4);

    transition:.3s;
}

.login-card:hover{

    transform:
    translateY(-5px);
}

.title{

    text-align:center;

    font-size:40px;

    font-weight:800;

    margin-bottom:30px;
}

.title i{

    color:#38bdf8;
}

label{

    font-size:18px;

    font-weight:600;

    margin-bottom:8px;

    display:block;
}

.form-control{

    background:
    rgba(255,255,255,0.12);

    border:
    1px solid rgba(255,255,255,0.20);

    color:white;

    border-radius:15px;

    padding:14px;

    transition:.3s;
}

.form-control::placeholder{

    color:#cbd5e1;
}

.form-control:focus{

    background:
    rgba(255,255,255,0.18);

    color:white;

    border-color:#38bdf8;

    box-shadow:
    0 0 15px rgba(56,189,248,.5);
}

.btn-login{

    width:100%;

    padding:15px;

    border:none;

    border-radius:15px;

    font-size:18px;

    font-weight:700;

    color:white;

    background:
    linear-gradient(
    135deg,
    #3b82f6,
    #8b5cf6
    );

    transition:.3s;
}

.btn-login:hover{

    transform:
    translateY(-3px);

    box-shadow:
    0 10px 25px rgba(139,92,246,.5);
}

.register-link{

    display:block;

    text-align:center;

    margin-top:20px;

    text-decoration:none;

    color:#e2e8f0;

    font-weight:600;
}

.register-link:hover{

    color:#38bdf8;
}

</style>

</head>

<body>

<div class="login-card">

    <!-- Heading -->

    <h1 class="title">

        <i class="bi bi-wallet2"></i>

        Login

    </h1>

    <!-- Flash Messages -->

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}

        {% for category, message in messages %}

            <div
                class="alert alert-{{ category }} alert-dismissible fade show mb-3">

                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
                </button>

            </div>

        {% endfor %}

    {% endif %}
    {% endwith %}

    <!-- Login Form -->

    <form method="POST">

        <div class="mb-4">

            <label class="form-label">

                Username

            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter Username"
                required>

        </div>

        <div class="mb-4">

            <label class="form-label">

                Password

            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter Password"
                required>

        </div>

        <!-- Login Button -->

        <button
            type="submit"
            class="btn-login">

            <i class="bi bi-box-arrow-in-right"></i>

            Login

        </button>

    </form>

    <!-- Register Link -->

    <div class="text-center mt-4">

        <a
            href="/register"
            class="register-link">

            Create New Account

        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
