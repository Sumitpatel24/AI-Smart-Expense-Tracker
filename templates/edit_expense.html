<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            min-height:100vh;

            background:
            linear-gradient(
            135deg,
            #0f172a,
            #1e293b,
            #2563eb
            );

            display:flex;
            justify-content:center;
            align-items:center;

            padding:40px;

            font-family:'Segoe UI',sans-serif;
        }

        .edit-card{

            width:850px;

            background:
            rgba(255,255,255,0.10);

            backdrop-filter:blur(20px);

            border:
            1px solid rgba(255,255,255,0.15);

            border-radius:30px;

            padding:45px;

            color:white;

            box-shadow:
            0 25px 60px rgba(0,0,0,.45);
        }

        .title{

            text-align:center;

            font-size:48px;

            font-weight:800;

            margin-bottom:35px;
        }

        .title i{

            color:#38bdf8;

            margin-right:10px;
        }

        label{

            font-size:22px;

            font-weight:700;

            margin-bottom:10px;

            display:block;
        }

        .form-control{

            background:
            rgba(255,255,255,0.12);

            border:
            1px solid rgba(255,255,255,0.20);

            color:white;

            border-radius:18px;

            padding:18px;

            font-size:18px;

            transition:.3s;
        }

        .form-control:hover{

            transform:
            translateY(-3px);

            border-color:#60a5fa;

            box-shadow:
            0 12px 25px rgba(96,165,250,.25);
        }

        .form-control:focus{

            background:
            rgba(255,255,255,0.18);

            color:white;

            border-color:#38bdf8;

            box-shadow:
            0 0 20px rgba(56,189,248,.55);
        }

        .btn-update{

            width:100%;

            padding:18px;

            border:none;

            border-radius:18px;

            font-size:22px;

            font-weight:700;

            color:white;

            background:
            linear-gradient(
            135deg,
            #3b82f6,
            #8b5cf6
            );

            transition:.35s;
        }

        .btn-update:hover{

            transform:
            translateY(-4px);

            box-shadow:
            0 18px 40px rgba(139,92,246,.55);
        }

        .back-btn{

            display:block;

            text-align:center;

            margin-top:20px;

            color:#e2e8f0;

            text-decoration:none;

            font-size:18px;

            font-weight:600;
        }

        .back-btn:hover{

            color:#38bdf8;
        }

    </style>

</head>

<body>

<div class="edit-card">

    <h1 class="title">

        <i class="bi bi-pencil-square"></i>

        Edit Expense

    </h1>

    <form method="POST">

        <!-- Amount -->

        <div class="mb-4">

            <label>

                <i class="bi bi-currency-rupee"></i>

                Amount

            </label>

            <input
                type="number"
                step="0.01"
                min="1"
                name="amount"
                value="{{ expense[2] }}"
                class="form-control"
                required>

        </div>

        <!-- Category -->

        <div class="mb-4">

            <label>

                <i class="bi bi-tag-fill"></i>

                Category

            </label>

            <select
                name="category"
                class="form-select"
                required>

                <option value="Food"
                {% if expense[3]=='Food' %}selected{% endif %}>
                Food
                </option>

                <option value="Travel"
                {% if expense[3]=='Travel' %}selected{% endif %}>
                Travel
                </option>

                <option value="Shopping"
                {% if expense[3]=='Shopping' %}selected{% endif %}>
                Shopping
                </option>

                <option value="Bills"
                {% if expense[3]=='Bills' %}selected{% endif %}>
                Bills
                </option>

                <option value="Entertainment"
                {% if expense[3]=='Entertainment' %}selected{% endif %}>
                Entertainment
                </option>

                <option value="Hospital"
                {% if expense[3]=='Hospital' %}selected{% endif %}>
                Hospital
                </option>

                <option value="Education"
                {% if expense[3]=='Education' %}selected{% endif %}>
                Education
                </option>

                <option value="Fuel"
                {% if expense[3]=='Fuel' %}selected{% endif %}>
                Fuel
                </option>

                <option value="Rent"
                {% if expense[3]=='Rent' %}selected{% endif %}>
                Rent
                </option>

            </select>

        </div>

        <!-- Description -->

        <div class="mb-4">

            <label>

                <i class="bi bi-card-text"></i>

                Description

            </label>

            <input
                type="text"
                name="description"
                value="{{ expense[4] }}"
                class="form-control"
                placeholder="Enter Description">

        </div>

        <!-- Expense Date -->

        <div class="mb-4">

            <label>

                <i class="bi bi-calendar-event"></i>

                Expense Date

            </label>

            <input
                type="date"
                name="expense_date"
                value="{{ expense[5] }}"
                class="form-control"
                required>

        </div>

        <!-- Update Button -->

        <button
            type="submit"
            class="btn-update">

            <i class="bi bi-check-circle-fill"></i>

            Update Expense

        </button>

    </form>

    <!-- Back Button -->

    <a
        href="/expenses"
        class="back-btn">

        <i class="bi bi-arrow-left-circle"></i>

        Back To Expenses

    </a>

</div>

</body>
</html>
