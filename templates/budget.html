<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Budget</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            min-height:100vh;

            background:
            linear-gradient(
            135deg,
            #0f172a,
            #1e293b,
            #2563eb
            );

            display:flex;
            justify-content:center;
            align-items:center;

            padding:40px;

            font-family:'Segoe UI',sans-serif;
        }

        .budget-card{

            width:800px;

            background:
            rgba(255,255,255,0.10);

            backdrop-filter:blur(25px);

            border:
            1px solid rgba(255,255,255,0.15);

            border-radius:30px;

            padding:50px;

            color:white;

            box-shadow:
            0 25px 60px rgba(0,0,0,.45);

            transition:.4s;
        }

        .budget-card:hover{

            transform:
            translateY(-8px);

            box-shadow:
            0 35px 80px rgba(0,0,0,.55);
        }

        .title{

            text-align:center;

            font-size:48px;

            font-weight:800;

            margin-bottom:40px;
        }

        .title i{

            color:#38bdf8;

            margin-right:12px;

            text-shadow:
            0 0 20px #38bdf8;
        }

        label{

            display:block;

            font-size:22px;

            font-weight:700;

            margin-bottom:12px;

            color:white;

            transition:.3s;
        }

        .input-group:hover label{

            color:#38bdf8;
        }

        .form-control{

            background:
            rgba(255,255,255,0.12);

            border:
            1px solid rgba(255,255,255,0.2);

            color:white;

            border-radius:18px;

            padding:20px;

            font-size:20px;

            transition:.3s;
        }

        .form-control::placeholder{

            color:#cbd5e1;
        }

        .form-control:hover{

            transform:
            translateY(-3px);

            border-color:#60a5fa;

            box-shadow:
            0 12px 25px rgba(96,165,250,.25);
        }

        .form-control:focus{

            background:
            rgba(255,255,255,0.18);

            color:white;

            border-color:#38bdf8;

            box-shadow:
            0 0 25px rgba(56,189,248,.55);
        }

        .btn-save{

            width:100%;

            padding:20px;

            border:none;

            border-radius:18px;

            font-size:22px;

            font-weight:700;

            color:white;

            background:
            linear-gradient(
            135deg,
            #3b82f6,
            #8b5cf6
            );

            transition:.35s;
        }

        .btn-save:hover{

            transform:
            translateY(-4px) scale(1.02);

            box-shadow:
            0 18px 40px rgba(139,92,246,.55);
        }

        .dashboard-btn{

            display:block;

            text-align:center;

            margin-top:25px;

            text-decoration:none;

            color:#e2e8f0;

            font-size:18px;

            font-weight:600;

            transition:.3s;
        }

        .dashboard-btn:hover{

            color:#38bdf8;
        }

        .info-box{

            margin-top:20px;

            padding:15px;

            border-radius:15px;

            background:
            rgba(255,255,255,0.08);

            text-align:center;

            font-size:18px;
        }

        @media(max-width:900px){

            .budget-card{

                width:100%;
                padding:30px;
            }

            .title{

                font-size:36px;
            }

            label{

                font-size:18px;
            }
        }

    </style>

</head>

<body>

<div class="budget-card">

    <h1 class="title">
        <i class="bi bi-piggy-bank-fill"></i>
        Set Monthly Budget
    </h1>

    <form method="POST">

        <label>
            <i class="bi bi-currency-rupee"></i>
            Monthly Budget
        </label>

       <input
         type="number"
         name="budget"
         class="form-control mb-4"
         placeholder="Enter Your Monthly Budget"
         min="100"
         max="10000000"
         step="100"
         required>

        <button class="btn-save">

            <i class="bi bi-check-circle-fill"></i>
            Save Budget

        </button>

    </form>

    <div class="info-box">
        💰 Set a monthly budget and track your spending smarter.
    </div>

    <a href="/dashboard" class="dashboard-btn">

        <i class="bi bi-arrow-left-circle"></i>
        Back To Dashboard

    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

setTimeout(function(){

    document.querySelectorAll('.alert').forEach(function(alert){

        alert.style.transition = "0.5s";
        alert.style.opacity = "0";

        setTimeout(function(){

            alert.remove();

        }, 500);

    });

}, 3000);

</script>
</body>
</html>
